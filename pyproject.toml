[project]
name = "math-logic-mcp"
version = "0.2.0"
description = "MCP server providing verified math & logic tools for small LLMs (Mistral, Llama, DeepSeek)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Open Source Community" }]
keywords = ["mcp", "llm", "reasoning", "symbolic", "math", "logic", "proof", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp>=2.0.0",
    "sympy>=1.12",
    "z3-solver>=4.12.2",
    "pydantic>=2.0",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "black>=23.7",
    "flake8>=6.0",
    "mypy>=1.4",
    "isort>=5.12",
]
full = [
    "ortools>=9.7.2996",
    "litellm>=1.26.0",
    "redis>=5.0.0",
    "lark>=1.1",
]

[project.scripts]
math-logic-mcp = "math_logic.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ismailkerimov/math-logic-mcp"
Repository = "https://github.com/ismailkerimov/math-logic-mcp"
"Bug Tracker" = "https://github.com/ismailkerimov/math-logic-mcp/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["math_logic*"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.isort]
profile = "black"
line_length = 100
